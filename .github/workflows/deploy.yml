name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual deploy'
        required: false
        default: 'Manual trigger'

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      should_deploy: ${{ steps.check.outputs.changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check for relevant changes
        id: check
        uses: ./.github/actions/has-changes
        with:
          patterns: |
            \.html$
            \.php$
            \.css$
            \.js$
            \.yml$
            \.htaccess$
            includes/
            scripts/
            images/

  deploy:
    needs: detect
    if: needs.detect.outputs.should_deploy == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ssh-key: ${{ secrets.CPANEL_SSH_KEY }}
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install chromium
      - name: Run link checks
        run: npm test
      - name: Push to cPanel
        run: |
          mkdir -p ~/.ssh
          ssh-add -l || true
          if ! ssh-add -l >/dev/null 2>&1; then
            eval "$(ssh-agent -s)"
            printf '%s\n' "${{ secrets.CPANEL_SSH_KEY }}" | ssh-add -
          fi
          CPANEL_HOST="$(echo '${{ secrets.CPANEL_REMOTE_URL }}' | sed -e 's|^ssh://||' -e 's|/.*$||')"
          ssh -o StrictHostKeyChecking=accept-new -o BatchMode=yes -o ConnectTimeout=20 "$CPANEL_HOST" true
          git remote add cpanel ${{ secrets.CPANEL_REMOTE_URL }}
          git push cpanel main
