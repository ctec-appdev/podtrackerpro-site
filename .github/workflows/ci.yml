name: CI — Link Check

on:
  push:
    branches: [staging]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install deps
        run: npm ci

      - name: Install Playwright
        run: npx playwright install chromium --with-deps

      - name: Run link checks
        run: npm test
